<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143058" />
      <stop offset="100%" stop-color="#2a588f" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29c2bd" />
      <stop offset="100%" stop-color="#197a8e" />
    </linearGradient>
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#197a8e" />
      <stop offset="100%" stop-color="#143058" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Mark (The Ribbon 'A') -->
  <g transform="translate(100, 30) scale(0.6)" filter="url(#shadow)">
    <!-- Right Teal Arch -->
    <path d="M 250 20 C 300 20, 380 160, 420 300 C 440 370, 390 400, 350 400 C 310 400, 290 350, 270 280 L 190 140 Z" fill="url(#tealGradient)" />
    
    <!-- Left Dark Blue Leg -->
    <path d="M 250 20 C 200 20, 120 160, 80 300 C 60 370, 110 400, 150 400 C 190 400, 210 350, 230 280 L 310 140 Z" fill="url(#blueGradient)" />
    
    <!-- Center Ribbon Swoosh (overlapping) -->
    <path d="M 80 300 C 120 280, 250 260, 280 230 C 310 200, 300 180, 270 180 C 220 180, 120 250, 80 300 Z" fill="url(#ribbonGradient)" />
    
    <!-- Inner Crossbar loop -->
    <path d="M 150 400 C 190 350, 280 310, 320 280 C 350 260, 360 220, 340 200 C 300 240, 210 280, 150 400 Z" fill="url(#blueGradient)" />
  </g>

  <!-- Typography -->
  <g transform="translate(250, 340)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <!-- ASAAN -->
    <text y="0" font-size="52" font-weight="900" fill="#1b2a47" letter-spacing="4">ASAAN</text>
    <!-- LABS -->
    <text y="50" font-size="42" font-weight="800" fill="#1b2a47" letter-spacing="6">LABS</text>
    <!-- Tagline -->
    <text y="90" font-size="22" font-weight="300" fill="#808a9a" letter-spacing="1">Simplifying life with AI.</text>
  </g>
</svg>
